{% extends main_base %}
{% load crispy_forms_tags %}

{% block content %}
<div class="card shadow-sm p-4">
    <h2 class="mb-4">آپلود موجودی موقت از طریق اکسل</h2>
    <p class="text-muted">
        لطفا فایل اکسل حاوی اطلاعات موجودی‌های موقت را آپلود کنید.
        <br>
        <strong>ساختار فایل:</strong> ستون اول: نام یا کد دارو، ستون دوم: تعداد موجودی.
    </p>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-3">آپلود و ایجاد موجودی</button>
    </form>
</div>
{% endblock %}
