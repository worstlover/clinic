{% extends "base.html" %}
{% block content %}

<div class="container-fluid" style="direction: rtl; text-align: right; max-width: 600px;">
    <div class="card mt-4 shadow-sm" style="border-radius: 20px;">
        <div class="card-body p-4 text-center">
            <h5 class="font-weight-bold mb-4">📥 بارگذاری اسکن ویزیت</h5>

            {% if not scan_obj %}
                <div id="camera-container" class="d-none mb-3">
                    <video id="video" width="100%" autoplay class="rounded shadow-sm" style="background: #000;"></video>
                    <canvas id="canvas" class="d-none"></canvas>
                    <button type="button" class="btn btn-danger btn-block mt-2 py-3" onclick="takeSnapshot()">
                        📸 گرفتن عکس (Capture)
                    </button>
                    <button type="button" class="btn btn-link text-muted" onclick="stopCamera()">انصراف</button>
                </div>

                <div id="upload-options">
                    <button type="button" class="btn btn-primary btn-block py-3 mb-3" onclick="startCamera()" style="border-radius: 15px;">
                        <i class="fas fa-camera ml-2"></i> استفاده از دوربین دستگاه
                    </button>

                    <div class="text-center text-muted small mb-3">یا</div>

                    <form method="post" enctype="multipart/form-data" id="file-form">
                        {% csrf_token %}
                        <label for="file_input" class="btn btn-outline-secondary btn-block py-3" style="border-radius: 15px; border-style: dashed;">
                            <i class="fas fa-images ml-2"></i> انتخاب عکس از حافظه
                        </label>
                        <input type="file" name="image" id="file_input" accept="image/*" style="display: none;" onchange="this.form.submit()">
                    </form>
                </div>

                <form id="camera-form" method="post" enctype="multipart/form-data" style="display:none;">
                    {% csrf_token %}
                    <input type="file" name="image" id="camera-blob">
                </form>

            {% else %}
                <div class="alert alert-success">تصویر آماده است</div>
                <img src="{{ scan_obj.image.url }}" class="img-fluid rounded mb-3" style="max-height: 350px;">
                
                <a href="{% url 'aiapp:process' scan_obj.pk %}" class="btn btn-success btn-block btn-lg py-3 shadow" style="border-radius: 15px;">
                    🚀 شروع تحلیل هوشمند (Process)
                </a>
                <a href="{% url 'aiapp:upload' %}" class="btn btn-link text-danger mt-2">حذف و تلاش مجدد</a>
            {% endif %}
        </div>
    </div>
</div>

<script>
    let video = document.getElementById('video');
    let canvas = document.getElementById('canvas');
    let stream = null;

    async function startCamera() {
        try {
            // درخواست دسترسی به دوربین
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            video.srcObject = stream;
            document.getElementById('camera-container').classList.remove('d-none');
            document.getElementById('upload-options').classList.add('d-none');
        } catch (err) {
            alert("خطا در دسترسی به دوربین: " + err);
        }
    }

    function stopCamera() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        document.getElementById('camera-container').classList.add('d-none');
        document.getElementById('upload-options').classList.remove('d-none');
    }

    function takeSnapshot() {
        // رسم تصویر ویدیو روی کانواس
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        // تبدیل کانواس به فایل (Blob)
        canvas.toBlob(function(blob) {
            let file = new File([blob], "camera_capture.jpg", { type: "image/jpeg" });
            let container = new DataTransfer();
            container.items.add(file);
            
            // قرار دادن فایل در اینپوت مخفی و ارسال فرم
            let input = document.getElementById('camera-blob');
            input.files = container.files;
            document.getElementById('camera-form').submit();
        }, 'image/jpeg');
    }
</script>

<style>
    body { background-color: #f8f9fa; }
    .btn-primary { background: #007bff; border-radius: 15px; }
    .btn-success { border-radius: 15px; font-weight: bold; }
</style>
{% endblock %}
