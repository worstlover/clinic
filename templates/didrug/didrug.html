{% extends main_base %}
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Didrug | شناسایی دارو</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .file-input-container {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>اپلیکیشن Didrug: شناسایی دارو</h4>
            </div>
            <div class="card-body">
                
                <form id="process-form" action="{% url 'process_data' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <h5 class="border-bottom pb-2">۱. عکس جعبه دارو (برای نام)</h5>
                    <div class="mb-3">
                        <label for="drugBoxImage" class="form-label">عکس جعبه دارو:</label>
                        <div class="input-group">
                            <input class="form-control" type="file" id="drugBoxImage" name="drug_box_image" accept="image/*" required>
                            <button type="button" class="btn btn-primary" id="drugCameraBtn">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                        <img id="drugPreview" class="img-fluid mt-2 d-none" />
                        <div class="camera-stream-container mt-2 d-none" id="drugCameraContainer">
                            <video id="drugVideo" class="w-100" autoplay playsinline></video>
                            <button type="button" class="btn btn-success mt-2 w-100" id="captureDrugBtn">
                                <i class="fas fa-camera"></i> گرفتن عکس جعبه دارو
                            </button>
                        </div>
                    </div>

                    <hr class="my-4">

                    <h5 class="border-bottom pb-2">۲. QR کد (برای تاریخ انقضا و اطلاعات)</h5>
                    <div class="mb-3">
                        <label for="qrCodeImage" class="form-label">عکس QR کد:</label>
                        <div class="input-group">
                            <input class="form-control" type="file" id="qrCodeImage" name="qr_code_image" accept="image/*">
                            <button type="button" class="btn btn-primary" id="qrCameraBtn">
                                <i class="fas fa-camera"></i>
                            </button>
                        </div>
                        <img id="qrPreview" class="img-fluid mt-2 d-none" />
                        <div class="camera-stream-container mt-2 d-none" id="qrCameraContainer">
                            <video id="qrVideo" class="w-100" autoplay playsinline></video>
                            <button type="button" class="btn btn-success mt-2 w-100" id="captureQrBtn">
                                <i class="fas fa-camera"></i> گرفتن عکس QR کد
                            </button>
                        </div>
                    </div>
                    <div class="mb-3 text-center">
                        <span class="text-muted">یا</span>
                        <button id="start-scanner-btn" type="button" class="btn btn-secondary w-100 mt-2">
                            <i class="fas fa-barcode"></i> اسکن زنده
                        </button>
                        <div id="qr-reader" class="mt-3 d-none" style="width: 100%;"></div>
                    </div>
                    
                    <button type="submit" class="btn btn-success w-100 mt-4">پردازش کامل</button>
                </form>

                <div id="result" class="mt-4 p-3 border rounded d-none">
                    <h5 class="border-bottom pb-2">نتایج پردازش:</h5>
                    <p id="persianName"></p>
                    <p id="expiryDate"></p>
                    <p id="qrContent"></p>
                </div>
                <div id="message" class="mt-4 alert d-none"></div>
            </div>
        </div>
    </div>
    <canvas id="hiddenCanvas" style="display: none;"></canvas>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const processForm = document.getElementById('process-form');
            const drugCameraBtn = document.getElementById('drugCameraBtn');
            const qrCameraBtn = document.getElementById('qrCameraBtn');
            const captureDrugBtn = document.getElementById('captureDrugBtn');
            const captureQrBtn = document.getElementById('captureQrBtn');
            const drugVideo = document.getElementById('drugVideo');
            const qrVideo = document.getElementById('qrVideo');
            const drugCameraContainer = document.getElementById('drugCameraContainer');
            const qrCameraContainer = document.getElementById('qrCameraContainer');
            const drugPreview = document.getElementById('drugPreview');
            const qrPreview = document.getElementById('qrPreview');
            const startScannerBtn = document.getElementById('start-scanner-btn');
            const qrReader = document.getElementById('qr-reader');
            const drugBoxImageInput = document.getElementById('drugBoxImage');
            const qrCodeImageInput = document.getElementById('qrCodeImage');
            const messageDiv = document.getElementById('message');
            const resultDiv = document.getElementById('result');

            let qrCodeContent = null; // To store live QR scan content

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = `mt-4 alert alert-${type}`;
                messageDiv.classList.remove('d-none');
            }

            // Function to handle camera activation
            async function startCamera(videoElement, containerElement) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    videoElement.srcObject = stream;
                    containerElement.classList.remove('d-none');
                } catch (err) {
                    showMessage('دسترسی به دوربین ممکن نیست: ' + err.message, 'danger');
                }
            }

            // Function to stop the camera stream
            function stopCamera(videoElement, containerElement) {
                const stream = videoElement.srcObject;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    containerElement.classList.add('d-none');
                }
            }
            
            // Function to handle capturing a photo from the camera stream
            function capturePhoto(videoElement, previewElement, fileInput) {
                const hiddenCanvas = document.getElementById('hiddenCanvas');
                const context = hiddenCanvas.getContext('2d');
                hiddenCanvas.width = videoElement.videoWidth;
                hiddenCanvas.height = videoElement.videoHeight;
                context.drawImage(videoElement, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                
                const dataUrl = hiddenCanvas.toDataURL('image/jpeg');
                previewElement.src = dataUrl;
                previewElement.classList.remove('d-none');

                hiddenCanvas.toBlob(blob => {
                    const file = new File([blob], `${fileInput.name}.jpg`, { type: "image/jpeg" });
                    
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    fileInput.files = dataTransfer.files;
                    
                    showMessage('عکس با موفقیت گرفته شد.', 'success');
                }, 'image/jpeg');
            }

            // Event listeners for drug box
            drugCameraBtn.addEventListener('click', () => {
                stopCamera(qrVideo, qrCameraContainer);
                startCamera(drugVideo, drugCameraContainer);
            });

            captureDrugBtn.addEventListener('click', () => {
                capturePhoto(drugVideo, drugPreview, drugBoxImageInput);
                stopCamera(drugVideo, drugCameraContainer);
            });

            // Event listeners for QR code
            qrCameraBtn.addEventListener('click', () => {
                stopCamera(drugVideo, drugCameraContainer);
                startCamera(qrVideo, qrCameraContainer);
            });

            captureQrBtn.addEventListener('click', () => {
                capturePhoto(qrVideo, qrPreview, qrCodeImageInput);
                stopCamera(qrVideo, qrCameraContainer);
            });
            
            // Form submission
            processForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                resultDiv.classList.add('d-none');
                showMessage('در حال پردازش...', 'info');

                const formData = new FormData(processForm);

                // Add live QR content if available
                if (qrCodeContent) {
                    formData.append('qr_code_content', qrCodeContent);
                }

                try {
                    const response = await fetch(processForm.action, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();
                    
                    if (data.status !== 'error') {
                        document.getElementById('persianName').innerHTML = `<strong>نام فارسی:</strong> ${data.persian_name || 'یافت نشد'}`;
                        document.getElementById('expiryDate').innerHTML = `<strong>تاریخ انقضا:</strong> ${data.expiry_date || 'یافت نشد'}`;
                        document.getElementById('qrContent').innerHTML = `<strong>محتوای QR کد:</strong> ${data.qr_code_content || 'یافت نشد'}`;
                        resultDiv.classList.remove('d-none');
                    }
                    showMessage(data.message, data.status === 'success' ? 'success' : 'warning');
                } catch (e) {
                    showMessage('خطا در برقراری ارتباط با سرور.', 'danger');
                }
            });

            // HTML5-QR-Code Scanner
            const html5QrCode = new Html5Qrcode("qr-reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            startScannerBtn.addEventListener('click', () => {
                stopCamera(drugVideo, drugCameraContainer);
                stopCamera(qrVideo, qrCameraContainer);
                startScannerBtn.classList.add('d-none');
                qrReader.classList.remove('d-none');
                qrCodeImageInput.value = ''; // Clear file input when using live scan

                html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText, decodedResult) => {
                        html5QrCode.stop().then(() => {
                            startScannerBtn.classList.remove('d-none');
                            qrReader.classList.add('d-none');
                            qrCodeContent = decodedText; // Store decoded text
                            showMessage('کد QR با موفقیت اسکن شد. حال می‌توانید جعبه دارو را آپلود کرده و پردازش کامل را انجام دهید.', 'success');
                        });
                    },
                    (errorMessage) => { /* Silent error handling */ }
                ).catch(err => {
                    showMessage('خطا در دسترسی به دوربین. لطفاً دسترسی را بررسی کنید.', 'danger');
                    startScannerBtn.classList.remove('d-none');
                    qrReader.classList.add('d-none');
                });
            });
        });
    </script>
</body>
</html>
