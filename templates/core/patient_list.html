{% extends main_base %}
{% load static %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-fluid px-2 px-md-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 m-0 text-gray-800 fw-bold">{{ page_title }}</h1>
            <p class="text-muted small mb-0">مدیریت و جستجوی پرونده بیماران</p>
        </div>
        
        <a href="{% url 'core:patient_create' %}" class="btn btn-success shadow-sm px-4 py-2 rounded-pill d-flex align-items-center">
            <i class="fas fa-plus-circle me-md-2"></i>
            <span class="d-none d-md-inline">افزودن بیمار جدید</span>
        </a>
    </div>

    <div class="card shadow-sm mb-4 border-0" style="border-radius: 15px;">
        <div class="card-body">
            <form method="GET" id="searchForm" action="{% url 'core:patient_list' %}">
                <div class="row">
                    <div class="col-12">
                        <div class="input-group mb-2">
                            <span class="input-group-text border-0 bg-light" style="border-radius: 0 12px 12px 0;">
                                <i class="fas fa-search text-muted"></i>
                            </span>
                            <input type="text" name="q" id="liveSearch" class="form-control border-0 bg-light py-2" 
                                   placeholder="جستجوی سریع (نام، کد ملی، موبایل، کد پرسنلی...)" 
                                   value="{{ search_query|default:'' }}" 
                                   autocomplete="off"
                                   style="border-radius: 12px 0 0 12px;">
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-2">
                    <div class="d-flex gap-2">
                        <button class="btn btn-link btn-sm text-decoration-none" type="button" data-bs-toggle="collapse" data-bs-target="#advancedFilters">
                            <i class="fas fa-sliders-h me-1"></i> تنظیمات فیلتر پیشرفته
                        </button>
                    </div>
                    <div class="d-flex gap-2">
                        <a href="{% url 'core:patient_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="fas fa-sync-alt me-1"></i> بازنشانی
                        </a>
                        <button type="submit" class="btn btn-primary btn-sm rounded-pill px-4 d-md-none">
                            جستجو
                        </button>
                    </div>
                </div>

                <div class="collapse {% if advanced_filters_applied %}show{% endif %} mt-3" id="advancedFilters">
                    <div class="p-4 bg-light rounded-4 shadow-inner border border-dashed">
                        {% crispy filter.form %}
                        <div class="mt-3 text-start border-top pt-3">
                            <button type="submit" class="btn btn-primary px-5 rounded-pill">اعمال فیلترهای دقیق</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div id="patient-result-container" class="position-relative">
        {% include 'core/patient_list_partial.html' %}
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    let delayTimer;

    function fetchResults(query, page = 1) {
        // افکت لودینگ حرفه‌ای
        $('#patient-result-container').css('opacity', '0.4');
        
        $.ajax({
            url: window.location.pathname,
            data: { 
                'q': query, 
                'page': page,
                'ajax': '1' 
            },
            type: 'GET',
            headers: { 'X-Requested-With': 'XMLHttpRequest' },
            success: function(response) {
                $('#patient-result-container').html(response.html).css('opacity', '1');
            },
            error: function(xhr) {
                $('#patient-result-container').css('opacity', '1');
                console.error("خطا در دریافت اطلاعات از سرور");
            }
        });
    }

    $('#liveSearch').on('input', function() {
        clearTimeout(delayTimer);
        let q = $(this).val();
        delayTimer = setTimeout(function() {
            fetchResults(q);
        }, 400);
    });

    $(document).on('click', '.ajax-page', function(e) {
        e.preventDefault();
        let url = new URL($(this).attr('href'), window.location.origin);
        let page = url.searchParams.get('page');
        fetchResults($('#liveSearch').val(), page);
    });
});
</script>
{% endblock %}
